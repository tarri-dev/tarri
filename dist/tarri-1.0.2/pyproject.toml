[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tarri"
version = "1.0.2"
description = "Bahasa pemrograman TARRI - Teknologi Algoritmik untuk Representasi dan Rekayasa Indonesia"
authors = [
  { name = "Tarri Dev", email = "bahasa.tarri@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "lark-parser>=0.12.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.24.0",
  "mysql-connector-python>=8.0.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
repl = ["prompt-toolkit>=3.0.0", "rich>=13.0.0", "colorama>=0.4.6"]

[project.scripts]
tarri = "tarri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Sertakan file grammar.lark di dalam package
[tool.setuptools.package-data]
"tarri" = ["grammar.lark"]

# Pastikan semua package data di-include
[tool.setuptools]
include-package-data = true

[project.urls]
Homepage = "https://github.com/tarri-dev/tarri"
Source = "https://github.com/tarri-dev/tarri"
Issues = "https://github.com/tarri-dev/tarri/issues"
